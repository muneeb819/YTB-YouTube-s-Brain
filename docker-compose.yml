services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      YTB_SECRET_KEY: ${YTB_SECRET_KEY:-change-me}
      YTB_ADMIN_EMAIL: ${YTB_ADMIN_EMAIL:-admin@example.com}
      YTB_ADMIN_PASSWORD: ${YTB_ADMIN_PASSWORD:-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - ./backend/data:/app/data
      - ./backend/workspace:/app/workspace
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped